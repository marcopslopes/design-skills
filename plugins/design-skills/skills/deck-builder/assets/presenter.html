<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaving presenter…</title>
<style>
  html,body{height:100%;margin:0;background:#1a1d24;color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;}
  a{color:#58a6ff}
  p{line-height:1.5;max-width:28rem;margin:0 1rem;}
</style>
</head>
<body>
<p>Presenter mode is off. Redirecting to the deck…<br>
<a id="back" href="/settings-ia-stakeholder-update.html">Back to deck</a></p>
<script>
(function () {
  var fallback = '/settings-ia-stakeholder-update.html';
  var target = fallback;
  try {
    var boot = JSON.parse(localStorage.getItem('northline-deck-presenter-boot') || '');
    if (boot && boot.deckUrl) target = boot.deckUrl;
  } catch (e) {}
  var a = document.getElementById('back');
  if (a) a.href = target;
  location.replace(target);
})();
</script>
</body>
</html>
