<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- TITLE --></title>
  <style>
    :root {
      --ink: #1a1f1e;
      --muted: #5c6563;
      --line: #d7ddd9;
      --bg: #f3f6f4;
      --paper: #ffffff;
      --accent: #007078;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      line-height: 1.55;
    }
    .bar {
      background: #0e2f31;
      color: #e5f6f7;
      padding: 12px 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .bar a { color: #9ee3e6; }
    article {
      max-width: 760px;
      margin: 32px auto 80px;
      background: var(--paper);
      padding: 48px 56px 64px;
      border: 1px solid var(--line);
    }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
    h2 { font-size: 1.25rem; margin: 2rem 0 0.75rem; }
    p, li { font-size: 1.05rem; }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    img { max-width: 100%; height: auto; display: block; margin: 1.25rem 0; border: 1px solid var(--line); }
    figure { margin: 1.25rem 0; }
    figure img {
      margin: 0;
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      object-position: top;
    }
    figcaption {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.45rem;
    }
    table { width: 100%; border-collapse: collapse; font-family: "Segoe UI", system-ui, sans-serif; font-size: 0.92rem; margin: 1rem 0 1.5rem; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
    th { color: var(--accent); font-weight: 600; }
    a { color: var(--accent); }
    code { font-size: 0.88em; background: var(--bg); padding: 0.1em 0.35em; }
    .meta {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta strong { color: var(--ink); }
    .badge { display: inline-block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
    .badge-high { background: #ffebeb; color: #9b2c2c; }
    .badge-med { background: #fff3e0; color: #9a5b12; }
    .badge-low { background: #e6f4ea; color: #276749; }
    .badge-p1 { background: #ffebeb; color: #9b2c2c; }
    .badge-p2 { background: #fff3e0; color: #9a5b12; }
    .badge-p3 { background: var(--bg); color: var(--muted); }
    .fail { color: #9b2c2c; font-weight: 600; }
    .pass { color: #276749; font-weight: 600; }
    .na { color: var(--muted); }
    @media (max-width: 640px) {
      article { margin: 0; padding: 28px 20px 48px; border: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    Review report
    <!-- optional: local serve note -->
  </div>
  <article>
    <!-- fill from findings.md using templates.md — do not invent findings -->
  </article>
</body>
</html>
